previews:
  generation: automatic
  expireAfterDays: 1

databases:
  - name: vkdby-db
    databaseName: vkdby_production
    user: vkdby
    plan: free # Note: The free database plan expires after 90 days.
    region: singapore

services:
  - type: web
    name: vkdby
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails db:migrate && bundle exec rails db:seed && bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vkdby-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
      # 512MB/0.5CPUのStarter向けに2まで絞っていたが、2GB/1CPUのStandard増強（#1344）
      # 後はスレッド枯渇によるレスポンス遅延が発生したため引き上げ（#1370）
      - key: RAILS_MAX_THREADS
        value: 5
      - key: MALLOC_ARENA_MAX
        value: 2
    region: singapore
    # 512MBのStarterでOOM再起動が頻発したため2GB/1CPUのStandardに増強していた
    # （#1344）。tag_index_itemsのN+1修正（#1384）を受けて一度Starterに戻した
    # （#1388）が、24時間観測した結果512MBでは依然メモリが高帯域に張り付き
    # GC負荷起因の応答遅延が長時間継続したため、再度Standardに戻す（#1423）
    plan: standard
