previews:
  generation: automatic
  expireAfterDays: 1

databases:
  - name: vkdby-db
    databaseName: vkdby_production
    user: vkdby
    plan: free # Note: The free database plan expires after 90 days.
    region: singapore

services:
  - type: web
    name: vkdby
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails db:migrate && bundle exec rails db:seed && bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vkdby-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
      # 512MB/0.5CPUのStarter向けに2まで絞っていたが、2GB/1CPUのStandard増強（#1344）
      # 後はスレッド枯渇によるレスポンス遅延が発生したため引き上げ（#1370）
      - key: RAILS_MAX_THREADS
        value: 5
      - key: MALLOC_ARENA_MAX
        value: 2
    region: singapore
    plan: standard # 512MBのStarterでOOM再起動が頻発したため2GB/1CPUに増強（issue #1344）
