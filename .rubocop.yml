inherit_from: .rubocop_todo.yml

AllCops:
  Exclude:
    - 'app/views/**/*'
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'vendor/**/*'
    - 'node_modules/**/*'

Metrics/BlockLength:
  Exclude:
    - 'lib/tasks/import_wikipage.rb'
    - 'lib/tasks/import_person.rb'

Metrics/ClassLength:
  Exclude:
    - 'app/models/person.rb'
    - 'app/services/base_wikipage_importer.rb'
    - 'test/services/custom_page_draft_generator_test.rb'
    - 'test/helpers/application_helper_test.rb'
    - 'test/controllers/admin/temporary_snapshot_people_controller_test.rb'
    - 'test/models/unit_test.rb'
    - 'test/controllers/profiles_controller_test.rb'
    - 'test/controllers/custom_pages_controller_test.rb'
    - 'test/controllers/trends_controller_test.rb'
