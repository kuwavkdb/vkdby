<!doctype html>

<html lang="ja">

  <head>

    <title>ページが見つかりません (404 Not found) - VKDBY</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        -webkit-font-smoothing: antialiased;
        font-style: normal;
        font-weight: 400;
        letter-spacing: -0.0025em;
        line-height: 1.6;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 100%);
        }
      }

      a {
        color: #ffffff;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.2em;
        transition: opacity 0.2s;
      }

      a:hover {
        opacity: 0.8;
      }

      main {
        display: grid;
        gap: 1.5em;
        padding: 2em;
        place-items: center;
        text-align: center;
        max-width: 600px;
      }

      .site-name {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        opacity: 0.85;
      }

      .error-code {
        font-size: 8rem;
        font-weight: 900;
        line-height: 1;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        letter-spacing: -0.05em;
      }

      .error-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1em;
      }

      .error-message {
        font-size: 1rem;
        line-height: 1.8;
        opacity: 0.9;
      }

      .search-form {
        display: flex;
        gap: 0.5em;
        width: 100%;
        max-width: 24rem;
      }

      .search-form input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 0.75em 1em;
        border-radius: 50px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 1rem;
      }

      .search-form input[type="text"]::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      .search-form input[type="text"]:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.7);
      }

      .search-form button {
        padding: 0.75em 1.5em;
        border-radius: 50px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      .search-form button:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .link-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75em;
        justify-content: center;
      }

      .link-list a {
        display: inline-block;
        padding: 0.6em 1.4em;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50px;
        font-weight: 700;
        text-decoration: none;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        transition: all 0.3s;
      }

      .link-list a:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        opacity: 1;
      }

      .back-link {
        margin-top: 0.5em;
        display: inline-block;
        padding: 0.75em 2em;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50px;
        font-weight: 700;
        text-decoration: none;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        transition: all 0.3s;
      }

      .back-link:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        opacity: 1;
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/404.html -->

    <main>
      <div class="site-name">vkdb.jp</div>
      <div class="error-code">404</div>
      <div>
        <h1 class="error-title">ページが見つかりません</h1>
        <p class="error-message">
          未作成、または存在しないページです。<br>
          URLが正しいかご確認いただくか、以下から探してみてください。
        </p>
      </div>

      <form class="search-form" action="/search" method="get">
        <label for="q" style="position:absolute; left:-9999px;">検索</label>
        <input type="text" id="q" name="q" placeholder="Search units and people...">
        <button type="submit">検索</button>
      </form>

      <nav class="link-list" aria-label="主要ページへのリンク">
        <a href="/units">Units（バンド）</a>
        <a href="/people">People（個人）</a>
        <a href="/trends">Trends（動向）</a>
        <a href="/items">Items（アイテム）</a>
        <a href="/timeline">Timeline（年表）</a>
      </nav>

      <a href="/" class="back-link">トップページへ戻る</a>
    </main>

  </body>

</html>
